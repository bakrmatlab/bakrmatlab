<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
<title id="title">Code assembly line</title>
<desc id="desc">Code blocks travel into a red build machine and leave as OTPGuard, MoneyPal and Portfolio packages.</desc>
<style>
.belt{animation:belt 1s linear infinite}.input{animation:input 9s linear infinite}.b{animation-delay:-3s}.c{animation-delay:-6s}.output{animation:output 9s linear infinite}.pulse{animation:pulse 3s steps(2,end) infinite}.gear{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
@keyframes belt{to{stroke-dashoffset:-24}}@keyframes input{0%{transform:translateX(0);opacity:0}5%,88%{opacity:1}100%{transform:translateX(455px);opacity:0}}@keyframes output{0%{transform:translateX(0);opacity:0}12%,85%{opacity:1}100%{transform:translateX(425px);opacity:0}}@keyframes pulse{50%{fill:#ff6575}}@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.belt,.input,.output,.pulse,.gear{animation:none}.input,.output{opacity:1}.input.b{transform:translateX(160px)}.input.c{transform:translateX(320px)}.output.b{transform:translateX(145px)}.output.c{transform:translateX(290px)}}
</style>
<rect width="1200" height="270" fill="#111111"/>
<text x="44" y="40" fill="#ff6575" font-family="monospace" font-size="17">THE BUILD LINE</text>
<text x="1156" y="40" text-anchor="end" fill="#8d8d98" font-family="monospace" font-size="13">CODE IN / PROJECTS OUT</text>
<rect x="44" y="185" width="1112" height="32" rx="16" fill="#242428" stroke="#48484e"/>
<path class="belt" d="M60 201H1140" stroke="#72727b" stroke-width="8" stroke-dasharray="8 16"/>
<g fill="#111111" stroke="#df2638" stroke-width="3">
<circle cx="64" cy="201" r="11"/><circle cx="1136" cy="201" r="11"/>
</g>
<g class="input"><rect x="58" y="126" width="88" height="58" rx="4" fill="#29292e" stroke="#ff6575"/><text x="102" y="164" text-anchor="middle" fill="#ff6575" font-family="monospace" font-size="27">&lt;/&gt;</text></g>
<g class="input b"><rect x="58" y="126" width="88" height="58" rx="4" fill="#29292e" stroke="#ff6575"/><text x="102" y="164" text-anchor="middle" fill="#ff6575" font-family="monospace" font-size="27">{ }</text></g>
<g class="input c"><rect x="58" y="126" width="88" height="58" rx="4" fill="#29292e" stroke="#ff6575"/><text x="102" y="164" text-anchor="middle" fill="#ff6575" font-family="monospace" font-size="27">[ ]</text></g>
<g class="output"><rect x="686" y="122" width="132" height="62" rx="4" fill="#df2638"/><path d="M736 122V138H768V122" fill="#ff99a5"/><text x="752" y="165" text-anchor="middle" fill="white" font-family="monospace" font-size="13">OTPGUARD</text></g>
<g class="output b"><rect x="686" y="122" width="132" height="62" rx="4" fill="#df2638"/><path d="M736 122V138H768V122" fill="#ff99a5"/><text x="752" y="165" text-anchor="middle" fill="white" font-family="monospace" font-size="13">MONEYPAL</text></g>
<g class="output c"><rect x="686" y="122" width="132" height="62" rx="4" fill="#df2638"/><path d="M736 122V138H768V122" fill="#ff99a5"/><text x="752" y="165" text-anchor="middle" fill="white" font-family="monospace" font-size="13">PORTFOLIO</text></g>
<path d="M488 182V82H690V182H650V227H529V182Z" fill="#df2638" stroke="#ff6575" stroke-width="2"/>
<rect x="513" y="106" width="152" height="60" fill="#111111"/>
<text x="589" y="143" text-anchor="middle" fill="white" font-family="monospace" font-size="24" font-weight="bold">BUILD</text>
<rect class="pulse" x="544" y="184" width="12" height="12" fill="#111111"/><rect class="pulse" x="564" y="184" width="12" height="12" fill="#111111"/><rect class="pulse" x="584" y="184" width="12" height="12" fill="#111111"/>
<g class="gear" stroke="#111111" stroke-width="3"><circle cx="632" cy="192" r="12" fill="none"/><path d="M632 176V208M616 192H648M621 181L643 203M621 203L643 181"/></g>
<path d="M44 247H1156" stroke="#343437"/>
</svg>
